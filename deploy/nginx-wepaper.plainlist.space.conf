# Canonical wePaper origin. One app instance on 127.0.0.1:8788.
# Do not includeSubDomains (plainlist.space is a different site).
server {
    listen 80;
    listen [::]:80;
    server_name wepaper.plainlist.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://wepaper.plainlist.space$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wepaper.plainlist.space;

    ssl_certificate     /etc/letsencrypt/live/wepaper.plainlist.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wepaper.plainlist.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /www/wwwlogs/wepaper.plainlist.space.log;
    client_max_body_size 80m;

    # Compress JS/CSS/JSON. Leave application/pdf out of gzip_types so Range stays valid.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_hide_header Authorization;
        proxy_force_ranges on;
        # 宝塔 global proxy.conf enables proxy_cache; a Range 206 must not become the cached object.
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
